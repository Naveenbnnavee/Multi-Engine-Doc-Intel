<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="docIntelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="docGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Container -->
  <rect width="128" height="128" rx="28" fill="#030712"/>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="url(#docIntelGrad)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Backing Document Layer -->
  <rect x="42" y="24" width="54" height="72" rx="8" fill="url(#sheetGrad)" stroke="#334155" stroke-width="2" transform="rotate(8 69 60)"/>
  
  <!-- Primary Document Card -->
  <rect x="28" y="28" width="58" height="74" rx="8" fill="#090d16" stroke="url(#docIntelGrad)" stroke-width="2.5" filter="url(#docGlow)"/>

  <!-- Document Line Vectors -->
  <line x1="38" y1="44" x2="68" y2="44" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="54" x2="76" y2="54" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="64" x2="64" y2="64" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Neural Vector Graph Overlay -->
  <g filter="url(#docGlow)">
    <!-- Vector Nodes & Edges -->
    <line x1="42" y1="84" x2="64" y2="76" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="64" y1="76" x2="92" y2="86" stroke="#06b6d4" stroke-width="2"/>
    <line x1="64" y1="76" x2="74" y2="56" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Glowing Vector Dots -->
    <circle cx="42" cy="84" r="5" fill="#8b5cf6"/>
    <circle cx="64" cy="76" r="6" fill="#38bdf8"/>
    <circle cx="92" cy="86" r="5" fill="#06b6d4"/>
    <circle cx="74" cy="56" r="4" fill="#a855f7"/>

    <circle cx="64" cy="76" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Semantic Sparkle Accent -->
  <path d="M96 28 L98 34 L104 36 L98 38 L96 44 L94 38 L88 36 L94 34 Z" fill="url(#docIntelGrad)" filter="url(#docGlow)"/>
</svg>